<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Copy exercise</title>
    <style>
      body { font-family: Arial, sans-serif; width: 360px; padding: 12px; }
      button { width:100%; padding:10px; font-size:14px; margin-top:8px; }
      #status { margin-top:8px; font-size:12px; color:#333; }
      .option-row { display:flex; align-items:center; gap:8px; margin-top:6px; font-size:13px; }
      label { user-select:none; }
      code { background:#f3f3f3; padding:2px 4px; border-radius:3px; font-family:monospace; }
    </style>
  </head>
  <body>
    <div class="option-row">
      <input type="checkbox" id="stripDecorative" />
      <label for="stripDecorative">Remove decorative LaTeX</label>
    </div>

    <button id="copyBtn">Copy exercise text and LaTeX</button>
    <div id="status" aria-live="polite"></div>

    <script src="popup.js"></script>
  </body>
</html>
