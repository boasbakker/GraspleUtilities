<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Copy exercise</title>
    <style>
      body { font-family: Arial, sans-serif; width: 360px; padding: 12px; }
      button { width:100%; padding:10px; font-size:14px; margin-top:8px; }
      #status { margin-top:8px; font-size:12px; color:#333; }
      .option-row { display:flex; align-items:center; gap:8px; margin-top:6px; font-size:13px; }
      label { user-select:none; }
      code { background:#f3f3f3; padding:2px 4px; border-radius:3px; font-family:monospace; }
    </style>
  </head>
  <body>
    <h1>Grasple Utilities</h1>
    <h2>Settings</h2>
    <div class="option-row">
      <input type="checkbox" id="stripDecorative" />
      <label for="stripDecorative">Remove decorative LaTeX</label>
    </div>
    <div style="margin-top:16px;">
      <label for="aiPrompt" style="display:block; margin-bottom:4px; font-size:13px;">AI Prompt (prepended to question):</label>
      <textarea id="aiPrompt" rows="3" style="width:100%; padding:6px; font-size:12px; font-family:Arial, sans-serif; border:1px solid #ccc; border-radius:3px; resize:vertical;" placeholder="e.g., Please help me understand this question:"></textarea>
    </div>

    <!-- <button id="copyBtn">Copy exercise text and LaTeX</button>
    <div id="status" aria-live="polite"></div> -->

    <script src="popup2.js"></script>
    <!-- <script src="popup.js"></script> -->
  </body>
</html>
