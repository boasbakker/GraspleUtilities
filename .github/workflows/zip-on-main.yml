name: Zip & release on every push (contents at root, exclude .gitattributes)

on:
  push:
    branches: ["**"]    # runs on every branch push; change to ["main"] to limit to main

permissions:
  contents: write

jobs:
  zip-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare names
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          SAFE_REPO_NAME=$(echo "${GITHUB_REPOSITORY}" | tr "/" "-")
          ZIP_NAME="${SAFE_REPO_NAME}-${SHORT_SHA}.zip"
          RELEASE_TAG="run-${SHORT_SHA}"
          RELEASE_NAME="Auto-release ${SHORT_SHA} (${GITHUB_REF_NAME})"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV

      - name: Create zip of repository contents (no top-level folder) excluding .gitattributes
        run: |
          cd "$GITHUB_WORKSPACE"
          # include dotfiles, zip repository contents (not the parent folder),
          # and exclude git metadata, workflow files and .gitattributes
          shopt -s dotglob
          zip -r "$ZIP_NAME" * -x ".git/*" ".github/*" ".gitattributes"

      - name: Create GitHub release and upload zip (ncipollo/release-action@v1)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
