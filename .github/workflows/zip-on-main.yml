name: Zip & release on tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  zip-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          ZIP_NAME="${{ github.repository }}-${TAG}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "RELEASE_NAME=Release $TAG" >> $GITHUB_ENV

      - name: Create zip
        run: zip -r "$ZIP_NAME" . -x ".git/*" "node_modules/*" "dist/*" "__pycache__/*"

      - name: Create GitHub release and upload zip
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
