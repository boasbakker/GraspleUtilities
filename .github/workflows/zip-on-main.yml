name: Zip & release on main push

on:
  push:
    branches: ["main"]   # runs when commits are pushed to main

permissions:
  contents: write

jobs:
  zip-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup names
        run: |
          SHA=${{ github.sha }}
          ZIP_NAME="${{ github.repository }}-${SHA:0:7}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "RELEASE_TAG=run-${SHA}" >> $GITHUB_ENV
          echo "RELEASE_NAME=Auto-release ${SHA:0:7}" >> $GITHUB_ENV

      - name: Create zip
        run: zip -r "$ZIP_NAME" . -x ".git/*" "node_modules/*" "dist/*"

      - name: Create or update release and upload asset
        uses: ncipollo/release-action@v2
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
